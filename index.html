<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paintings</title>
  <meta name="description" content="Paintings gallery">
  <!-- The page may only talk to its own site: visitors' wall photos can never be sent anywhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <h1 id="artist-name">&nbsp;</h1>
    <p id="tagline" class="tagline"></p>
    <nav>
      <a href="#" data-nav="gallery">Gallery</a>
      <a href="#about" data-nav="about">About</a>
    </nav>
  </header>

  <main>
    <section id="gallery" aria-label="Paintings">
      <div id="filters" class="filters" role="group" aria-label="Filter by keyword"></div>

      <div id="stage" class="stage" tabindex="0" aria-roledescription="carousel" aria-label="Paintings carousel">
        <div id="track" class="track"></div>
        <button class="c-nav c-prev" aria-label="Previous painting">&#8249;</button>
        <button class="c-nav c-next" aria-label="Next painting">&#8250;</button>
      </div>

      <div id="info" class="info" aria-live="polite">
        <p id="counter" class="counter"></p>
        <h2 id="i-title"></h2>
        <p id="i-meta" class="meta"></p>
        <p id="i-desc" class="desc"></p>
        <p id="i-tags" class="tags"></p>
      </div>
      <p id="empty" class="empty" hidden>No paintings match these keywords. <button class="linkbtn" data-clear>Show all</button></p>
    </section>

    <section id="about" class="about" hidden>
      <p id="about-text"></p>
      <p id="contact"></p>
    </section>
  </main>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Full size painting">
    <button class="v-close" aria-label="Close">&times;</button>
    <button class="v-nav v-prev" aria-label="Previous">&#8249;</button>
    <button class="v-nav v-next" aria-label="Next">&#8250;</button>
    <div class="v-frame">
      <img id="v-img" alt="">
      <button id="v-wall" class="wallbtn">See it on your wall</button>
    </div>
  </div>

  <div id="room" class="room" hidden role="dialog" aria-modal="true" aria-label="See the painting on your wall">
    <div class="r-bar">
      <strong id="r-title"></strong>
      <span class="r-spacer"></span>
      <button class="r-close" aria-label="Close">&times;</button>
    </div>
    <div class="r-canvas-wrap">
      <canvas id="r-canvas"></canvas>
      <p id="r-hint" class="r-hint"></p>
      <form id="r-cal" class="r-cal" hidden>
        <label>Length of the line you drew
          <span><input id="r-cal-len" type="number" inputmode="decimal" min="1" step="any" required> cm</span>
        </label>
        <button type="submit">Apply</button>
        <button type="button" data-cal-cancel>Cancel</button>
      </form>
    </div>
    <div class="r-tools">
      <label class="r-btn">Use my photo<input id="r-file" type="file" accept="image/*" hidden></label>
      <button class="r-btn" id="r-sample">Sample room</button>
      <span class="r-group">
        <button class="r-btn" id="r-prev" aria-label="Previous painting">&#8249;</button>
        <button class="r-btn" id="r-next" aria-label="Next painting">&#8250;</button>
      </span>
      <label class="r-field">Size <input id="r-size" type="range" min="2" max="95" step="0.5"></label>
      <label class="r-field">Frame
        <select id="r-frame">
          <option value="none">None</option>
          <option value="black">Thin black</option>
          <option value="wood">Wood</option>
          <option value="mat">White mat</option>
        </select>
      </label>
      <button class="r-btn" id="r-cal-btn">Set real scale</button>
      <button class="r-btn" id="r-real" hidden>Real size</button>
      <button class="r-btn" id="r-save">Save picture</button>
    </div>
    <p class="r-privacy">Your photo stays in this browser. It is never uploaded or stored on the website.</p>
  </div>

  <footer class="site-footer"><span id="copy"></span></footer>
  <script src="assets/app.js"></script>
  <script src="assets/room.js"></script>
</body>
</html>
